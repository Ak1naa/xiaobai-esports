<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>活动专区 | 小摆电竞</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html">
        <span class="brand-mark">
          <img src="./xb-avatar-v2.png" alt="小摆电竞头像" />
        </span>
        <span>小摆电竞</span>
      </a>
      <nav class="nav-links" aria-label="主导航">

        <a href="./index.html#price">价格</a>
        <a href="./index.html#rules">赔付</a>
        <a href="./activities.html">活动</a>

      <section class="activity-hero section-wrap">
        <div>
          <p class="eyebrow">EVENT CENTER</p>
          <h1>活动专区</h1>
        </div>
      </section>

      <section class="section-wrap activity-showcase" aria-label="活动专区">
        <a class="activity-banner-card" href="#activity-preview" aria-label="放大查看活动图片">
